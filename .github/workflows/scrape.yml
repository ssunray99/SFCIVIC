name: Scrape civic meetings

on:
  schedule:
    # Daily at 14:00 UTC (06:00 PT / 07:00 PDT).
    # Runs every day to pick up newly posted agendas, updated event pages,
    # and minutes that land days or weeks after a hearing.
    - cron: '0 14 * * *'
  # Allow manual runs from the Actions tab for testing or backfills.
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Don't cancel other sources if one fails.
      fail-fast: false
      matrix:
        source:
          - planning
          - bos
          - bos-land-use
          - bos-budget
          - bos-rules
          - bos-public-safety
          - bos-gao
          - hpc
          - sfmta
          # Note: legislative notices (hearings) are folded into the planning
          # scraper (scraper/sources/planning.ts fetchLegislativeNotices) rather
          # than running as a separate job.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Playwright downloads ~150 MB of Chromium. Cache it keyed to the lockfile
      # so it only re-downloads when playwright version changes.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (browser already cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The scraper reads credentials via --env-file=.env.local (see package.json).
      # We write the file here from Actions secrets rather than changing the npm
      # script, so local dev behaviour is unchanged.
      #
      # Required secrets (set in repo Settings → Secrets → Actions):
      #   SUPABASE_URL              — project URL (https://xxx.supabase.co)
      #   SUPABASE_SERVICE_ROLE_KEY — service-role key (bypasses RLS; keep private)
      #   GEMINI_API_KEY            — Google Gemini API key for LLM extraction
      #                               (https://aistudio.google.com/apikey)
      - name: Write .env.local from secrets
        # tr -d '\r\n' strips any trailing CR/LF that crept in when the
        # secret was pasted into the GitHub UI. A trailing newline in
        # SUPABASE_URL produces malformed REST URLs that PostgREST rejects
        # with PGRST125 ("Invalid path specified in request URL").
        run: |
          {
            printf 'SUPABASE_URL='
            printf '%s' "${{ secrets.SUPABASE_URL }}" | tr -d '\r\n'
            printf '\nSUPABASE_SERVICE_ROLE_KEY='
            printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | tr -d '\r\n'
            printf '\nGEMINI_API_KEY='
            printf '%s' "${{ secrets.GEMINI_API_KEY }}" | tr -d '\r\n'
            printf '\n'
          } > .env.local

      - name: Run ${{ matrix.source }} scraper
        run: npm run scrape:${{ matrix.source }}

  # After every source has scraped, refresh the Legistar enrichment so newly
  # discovered BOS file numbers populate the legislation table the same day.
  enrich:
    name: Enrich Legistar legislation
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Always run, even if some matrix scrapes failed — partial enrichment is
    # still useful and the BOS jobs are likely the ones that succeeded anyway.
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
      - name: Install Playwright system deps (browser already cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Write .env.local from secrets
        # tr -d '\r\n' strips any trailing CR/LF that crept in when the
        # secret was pasted into the GitHub UI. A trailing newline in
        # SUPABASE_URL produces malformed REST URLs that PostgREST rejects
        # with PGRST125 ("Invalid path specified in request URL").
        run: |
          {
            printf 'SUPABASE_URL='
            printf '%s' "${{ secrets.SUPABASE_URL }}" | tr -d '\r\n'
            printf '\nSUPABASE_SERVICE_ROLE_KEY='
            printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | tr -d '\r\n'
            printf '\nGEMINI_API_KEY='
            printf '%s' "${{ secrets.GEMINI_API_KEY }}" | tr -d '\r\n'
            printf '\n'
          } > .env.local
      - name: Enrich Legistar HTML
        run: npm run enrich:legislation

  # Nightly chip-away at v3 (and earlier) rows + previously-failed/partial
  # extractions. Limit keeps cost predictable; over time this drains the
  # backlog without flooding Gemini.
  backfill:
    name: Backfill prompt-version rows
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
      - name: Install Playwright system deps (browser already cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Write .env.local from secrets
        # tr -d '\r\n' strips any trailing CR/LF that crept in when the
        # secret was pasted into the GitHub UI. A trailing newline in
        # SUPABASE_URL produces malformed REST URLs that PostgREST rejects
        # with PGRST125 ("Invalid path specified in request URL").
        run: |
          {
            printf 'SUPABASE_URL='
            printf '%s' "${{ secrets.SUPABASE_URL }}" | tr -d '\r\n'
            printf '\nSUPABASE_SERVICE_ROLE_KEY='
            printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | tr -d '\r\n'
            printf '\nGEMINI_API_KEY='
            printf '%s' "${{ secrets.GEMINI_API_KEY }}" | tr -d '\r\n'
            printf '\n'
          } > .env.local
      - name: Backfill 50 stale rows
        run: npm run backfill:prompt-version -- --limit 50
